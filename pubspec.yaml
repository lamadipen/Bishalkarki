name: bishal_karki_realtor_web
description: Premium single-page Flutter web app for Realtor Bishal Karki.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.8.0
  animated_text_kit: ^4.2.3
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.3.1
  carousel_slider: ^5.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/about_agent.jpg
